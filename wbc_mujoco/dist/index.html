<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Interactive WBC demo moved</title>
    <script>
      (() => {
        const target = new URL("../live/", window.location.href);
        target.search = window.location.search;
        target.hash = window.location.hash;
        window.location.replace(target.href);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=../live/" /></noscript>
  </head>
  <body>
    <p>The interactive WBC demo moved to <a href="../live/">its live page</a>.</p>
  </body>
</html>
